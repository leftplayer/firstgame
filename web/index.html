<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content"><meta name="theme-color" content="#000"><title>TYPE. — 安静地打完这一篇</title><link rel="stylesheet" href="./style.css"></head><body><main id="game"><div id="background"><header><span class="brand">TYPE.</span><button id="restart">Restart</button></header><div id="timer" aria-label="耗时秒数">0</div><div id="viewport" tabindex="0" role="button" aria-label="点击开始输入"><article id="article"></article></div></div><textarea id="input" aria-label="输入上方文章" autocomplete="off" autocorrect="off" inputmode="text" autocapitalize="off" spellcheck="false"></textarea><p id="status" role="status">正在加载…</p><section id="result" hidden aria-label="打字成绩"><div class="result-summary"><div class="score"><span id="whole"></span><span id="fraction"></span><span class="unit">s</span></div><dl class="metrics"><div><dt aria-label="准确率">ACC</dt><dd id="accuracy">—</dd></div><div><dt aria-label="每分钟字符数">CPM</dt><dd id="speed">—</dd></div><div><dt aria-label="字符数">CHARS</dt><dd id="characters">—</dd></div></dl></div><p id="message" role="status"></p><div class="actions"><button id="again" aria-label="Restart">Restart <span aria-hidden="true">↻</span></button><button id="share" aria-label="Share">Share <span aria-hidden="true">↗</span></button></div></section></main><script type="module" src="./app.js"></script></body></html>
