<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content"><meta name="theme-color" content="#000"><title>Now Typing — 安静地打完这一篇</title><link rel="stylesheet" href="./style.css?v=result-keyboard-4"></head><body><main id="game"><div id="background"><header><span class="brand" aria-label="Now Typing"><span class="brand-label">NOW <span>TYPING</span></span></span><button id="restart"><span class="button-label">Restart</span></button></header><div id="timer" aria-label="耗时秒数">0</div><div id="viewport" tabindex="0" role="button" aria-label="点击开始输入"><article id="article"></article></div></div><textarea id="input" aria-label="输入上方文章" autocomplete="off" autocorrect="off" inputmode="text" autocapitalize="off" spellcheck="false"></textarea><p id="status" role="status">正在加载…</p><section id="result" hidden aria-label="打字成绩"><div class="result-summary"><div class="score"><span id="whole"></span><span id="fraction"></span><span class="unit">s</span></div><dl class="metrics"><div><dt aria-label="准确率">ACC</dt><dd id="accuracy">—</dd></div><div><dt aria-label="每分钟英文单词数">WPM</dt><dd id="speed">—</dd></div><div><dt aria-label="英文单词数">WORDS</dt><dd id="words">—</dd></div><div><dt aria-label="字符数">CHARS</dt><dd id="characters">—</dd></div></dl></div><p id="message" role="status"></p><div class="actions"><button id="again" aria-label="Restart"><span class="button-label">Restart</span></button><button id="share" aria-label="Share"><span class="button-label">Share</span></button></div></section><details id="font-lab" open><summary>字体实验室 <span>收起 / 展开</span></summary><div class="font-lab-body"><div class="font-scope-tabs" role="group" aria-label="选择调整区域"><button data-font-target="title" aria-pressed="false">标题与按钮</button><button data-font-target="body" aria-pressed="true">正文</button><button data-font-target="data" aria-pressed="false">计时与成绩</button></div><div class="font-options-scroll"><div class="font-group-label">英文 · 3 款</div><div id="font-options-en" class="font-option-grid" role="group" aria-label="英文字体"></div><div class="font-group-label">中文 · 3 款</div><div id="font-options-zh" class="font-option-grid" role="group" aria-label="中文字体"></div><div class="font-preview"><div class="font-preview-title">NOW TYPING · 正在打字</div><div class="font-preview-body">cat and dog · 风穿过窗边</div><div class="font-preview-data">12.34s · AaBb WPM · 98% · 正在打字</div></div></div><p class="font-credit">本页使用 MiSans。</p><p id="font-note" role="status">正在加载字体…</p></div></details></main><script type="module" src="./app.js?v=result-keyboard-4"></script></body></html>
