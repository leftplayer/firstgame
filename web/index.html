<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content"><meta name="theme-color" content="#000"><title>Now Typing — 安静地打完这一篇</title><link rel="stylesheet" href="./style.css"></head><body><main id="game"><div id="background"><header><span class="brand" aria-label="Now Typing">NOW <span>TYPING</span></span><button id="restart">Restart</button></header><div id="timer" aria-label="耗时秒数">0</div><div id="viewport" tabindex="0" role="button" aria-label="点击开始输入"><article id="article"></article></div></div><textarea id="input" aria-label="输入上方文章" autocomplete="off" autocorrect="off" inputmode="text" autocapitalize="off" spellcheck="false"></textarea><p id="status" role="status">正在加载…</p><section id="result" hidden aria-label="打字成绩"><div class="result-summary"><div class="score"><span id="whole"></span><span id="fraction"></span><span class="unit">s</span></div><dl class="metrics"><div><dt aria-label="准确率">ACC</dt><dd id="accuracy">—</dd></div><div><dt aria-label="每分钟英文单词数">WPM</dt><dd id="speed">—</dd></div><div><dt aria-label="英文单词数">WORDS</dt><dd id="words">—</dd></div><div><dt aria-label="字符数">CHARS</dt><dd id="characters">—</dd></div></dl></div><p id="message" role="status"></p><div class="actions"><button id="again" aria-label="Restart">Restart</button><button id="share" aria-label="Share">Share</button></div></section><details id="font-lab" open><summary>字体实验室 <span>收起 / 展开</span></summary><div class="font-lab-body"><div class="font-select-row font-column-labels"><span>自由组合</span><span>英文 · 11 款</span><span>中文 · 8 款</span></div><div class="font-select-row"><span>标题与按钮</span><select id="font-title-en" data-font-scope="title" data-font-lang="en" aria-label="标题与按钮英文字体"></select><select id="font-title-zh" data-font-scope="title" data-font-lang="zh" aria-label="标题与按钮中文字体"></select></div><div class="font-select-row"><span>正文</span><select id="font-body-en" data-font-scope="body" data-font-lang="en" aria-label="正文英文字体"></select><select id="font-body-zh" data-font-scope="body" data-font-lang="zh" aria-label="正文中文字体"></select></div><div class="font-select-row"><span>计时与成绩</span><select id="font-data-en" data-font-scope="data" data-font-lang="en" aria-label="计时与成绩英文字体"></select><select id="font-data-zh" data-font-scope="data" data-font-lang="zh" aria-label="计时与成绩中文字体"></select></div><div class="font-preview"><div class="font-preview-title">NOW TYPING · 正在打字</div><div class="font-preview-body">cat and dog · 风穿过窗边</div><div class="font-preview-data">12.34s · 98% · 正在打字</div></div><p id="font-note" role="status">正在加载字体…</p></div></details></main><script type="module" src="./app.js"></script></body></html>
