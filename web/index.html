<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content"><meta name="theme-color" content="#000"><title>Now Typing — 安静地打完这一篇</title><link rel="stylesheet" href="./style.css"></head><body><main id="game"><div id="background"><header><span class="brand" aria-label="Now Typing">NOW <span>TYPING</span></span><button id="restart">Restart</button></header><div id="timer" aria-label="耗时秒数">0</div><div id="viewport" tabindex="0" role="button" aria-label="点击开始输入"><article id="article"></article></div></div><textarea id="input" aria-label="输入上方文章" autocomplete="off" autocorrect="off" inputmode="text" autocapitalize="off" spellcheck="false"></textarea><p id="status" role="status">正在加载…</p><section id="result" hidden aria-label="打字成绩"><div class="result-summary"><div class="score"><span id="whole"></span><span id="fraction"></span><span class="unit">s</span></div><dl class="metrics"><div><dt aria-label="准确率">ACC</dt><dd id="accuracy">—</dd></div><div><dt aria-label="每分钟英文单词数">WPM</dt><dd id="speed">—</dd></div><div><dt aria-label="英文单词数">WORDS</dt><dd id="words">—</dd></div><div><dt aria-label="字符数">CHARS</dt><dd id="characters">—</dd></div></dl></div><p id="message" role="status"></p><div class="actions"><button id="again" aria-label="Restart">Restart</button><button id="share" aria-label="Share">Share</button></div></section><details id="font-lab" open><summary>字体测试 <span>点击收起 / 展开</span></summary><div class="font-lab-body"><div class="font-row" role="group" aria-label="英文字体"><span>EN</span><button data-font-en="mono" aria-pressed="false">等宽</button><button data-font-en="sans" aria-pressed="false">无衬线</button><button data-font-en="serif" aria-pressed="false">衬线</button></div><div class="font-row" role="group" aria-label="中文字体"><span>中</span><button data-font-zh="sans" aria-pressed="false">黑体</button><button data-font-zh="serif" aria-pressed="false">宋体</button><button data-font-zh="kai" aria-pressed="false">楷体</button></div><div class="font-samples"><div>Now typing 0123456789</div><div>风穿过窗边，每一个字都有自己的节奏。</div></div><p id="font-note" role="status">正在加载字体…</p></div></details></main><script type="module" src="./app.js"></script></body></html>
