<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content"><meta name="theme-color" content="#000"><title>TYPE. — 安静地打完这一篇</title><link rel="stylesheet" href="./style.css"></head><body><main id="game"><div id="background"><header><span class="brand">TYPE.</span><button id="restart">Restart</button></header><div id="timer" aria-label="耗时秒数">0</div><div id="viewport" tabindex="0" role="button" aria-label="点击开始输入"><article id="article"></article></div></div><textarea id="input" aria-label="输入上方文章" autocomplete="off" autocorrect="off" inputmode="text" autocapitalize="off" spellcheck="false"></textarea><div class="feedback-controls" aria-label="打字反馈"><button id="sound" aria-pressed="true">音效 开</button><button id="haptic" aria-pressed="true">震动 开</button></div><p id="status" role="status">正在加载…</p><section id="result" hidden aria-label="打字成绩"><div class="score"><span id="whole"></span><span id="fraction"></span><span class="unit">s</span></div><dl class="metrics"><div><dt>准确率</dt><dd id="accuracy">—</dd></div><div><dt>字速 <small>字符/分钟</small></dt><dd id="speed">—</dd></div><div><dt>字符数</dt><dd id="characters">—</dd></div></dl><p id="message"></p><div class="actions"><button id="again">再来一次</button><button id="share">分享成绩</button></div></section></main><script type="module" src="./app.js"></script></body></html>
